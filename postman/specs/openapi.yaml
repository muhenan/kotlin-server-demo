openapi: 3.0.3
info:
  title: Kotlin Ktor Demo API
  version: 1.0.0
  description: |
    Demo HTTP API from `kotlin-server-demo` (Ktor + Netty + kotlinx.serialization).
    No database and no authentication; user payloads are generated in memory.
  contact:
    name: kotlin-server-demo
servers:
  - url: http://127.0.0.1:8080
    description: Local development (HOST/PORT env vars override bind address)
tags:
  - name: Health
    description: Process liveness
  - name: Greeting
    description: Sample query-parameter greeting
  - name: Users
    description: Demonstration user lookup (no persistence)
  - name: Echo
    description: JSON echo with validation

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health check
      description: Returns process liveness. Used as a smoke check after `gradlew run`.
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP

  /api/v1/hello:
    get:
      operationId: getHello
      tags: [Greeting]
      summary: Personalized greeting
      description: |
        Returns `Hello, {name}!`. The `name` query parameter is optional; blank or
        missing values default to `Ktor`.
      parameters:
        - name: name
          in: query
          required: false
          description: Display name to greet. Trimmed; blank values fall back to Ktor.
          schema:
            type: string
            default: Ktor
          example: Kotlin
      responses:
        "200":
          description: Greeting message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GreetingResponse"
              examples:
                default:
                  summary: Default name
                  value:
                    message: Hello, Ktor!
                named:
                  summary: Custom name
                  value:
                    message: Hello, Kotlin!

  /api/v1/users/{id}:
    get:
      operationId: getUserById
      tags: [Users]
      summary: Get a demonstration user
      description: |
        Returns a generated user for a positive integer id. This is not a database
        lookup. Non-numeric or non-positive ids return 400.
      parameters:
        - name: id
          in: path
          required: true
          description: User id. Must be a positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
      responses:
        "200":
          description: Generated demo user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 42
                name: Demo user 42
        "400":
          description: id is missing, not an integer, or not positive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: id must be a positive integer
        "404":
          description: Unknown path (Ktor StatusPages)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Endpoint not found

  /api/v1/echo:
    post:
      operationId: postEcho
      tags: [Echo]
      summary: Echo a JSON message
      description: |
        Accepts `{"message":"..."}`, trims whitespace, and returns the same message.
        Rejects empty messages, messages longer than 1000 characters, and invalid JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EchoRequest"
            example:
              message: Hello Ktor
      responses:
        "200":
          description: Trimmed message echoed back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoResponse"
              example:
                message: Hello Ktor
        "400":
          description: Invalid JSON body or message length outside 1–1000 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalidBody:
                  summary: Unparseable or missing message
                  value:
                    error: Invalid request body
                invalidMessage:
                  summary: Empty or too long after trim
                  value:
                    error: message must contain 1 to 1000 characters

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Liveness indicator
          example: UP
    GreetingResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Greeting text
          example: Hello, Kotlin!
    UserResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: Requested user id
          example: 42
        name:
          type: string
          description: Generated display name
          example: Demo user 42
    EchoRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: Text to echo. Leading/trailing whitespace is trimmed server-side.
          example: Hello Ktor
    EchoResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Trimmed message
          example: Hello Ktor
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: Endpoint not found
